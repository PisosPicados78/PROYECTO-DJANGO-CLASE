{% extends 'layouts/base.html' %}

{% block title %}Editar Grupo - Helpdesk{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-6 col-lg-5">
        <div class="surface-card">
            <div class="surface-header d-flex align-items-center gap-3">
                <span class="auth-icon-circle">
                    <i class="bi bi-pencil-square"></i>
                </span>
                <div>
                    <h1 class="h5 fw-bold mb-0">Editar grupo</h1>
                    <small class="text-muted">{{ grupo.name }}</small>
                </div>
            </div>
            <div class="p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="{{ form.name.id_for_label }}" class="form-label">{{ form.name.label }}</label>
                        {{ form.name }}
                        {% if form.name.errors %}
                            <div class="text-danger small mt-1">{{ form.name.errors }}</div>
                        {% endif %}
                    </div>
                    <div class="d-flex flex-column flex-sm-row gap-2 justify-content-end pt-2 border-top">
                        <a href="{% url 'grupos' %}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-lg me-1"></i>Cancelar
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-1"></i>Guardar cambios
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
