{% extends 'layouts/base.html' %}

{% block title %}Añadir Tarea{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <h3 class="mb-0 fw-bold">Añadir Tarea</h3>
                <small class="text-muted">Ticket: {{ ticket.titulo }}</small>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Guardar Tarea</button>
                        <a href="{% url 'detalle_ticket' ticket.id %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
