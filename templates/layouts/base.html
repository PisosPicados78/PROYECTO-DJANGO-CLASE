<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Helpdesk{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .main-container { margin-top: 2rem; margin-bottom: 2rem; }
        /* Auto-style Django forms */
        form p label { font-weight: 500; margin-bottom: 0.25rem; display: block; }
        form p input[type="text"], form p input[type="password"], form p input[type="email"], form p textarea, form p select {
            width: 100%;
            padding: 0.375rem 0.75rem;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            display: block;
        }
        form p input[type="file"] { margin-top: 0.5rem; display: block; }
        .helptext { font-size: 0.875em; color: #6c757d; display: block; margin-top: 0.25rem; }
        .errorlist { color: #dc3545; list-style-type: none; padding-left: 0; margin-bottom: 0.5rem; font-size: 0.875em; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">Helpdesk</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'acerca_de' %}">Acerca de</a></li>
                    {% if user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'tickets' %}">Tickets</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'grupos' %}">Grupos</a></li>
                    {% endif %}
                </ul>
                <ul class="navbar-nav ms-auto">
                    {% if user.is_authenticated %}
                        <li class="nav-item"><span class="nav-link text-light">Hola, {{ user.username }}</span></li>
                        <li class="nav-item">
                            <form action="{% url 'logout' %}" method="post" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-outline-light btn-sm mt-1 ms-2">Cerrar sesión</button>
                            </form>
                        </li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link" href="{% url 'login' %}">Iniciar sesión</a></li>
                        <li class="nav-item"><a class="btn btn-primary btn-sm mt-1 ms-2" href="{% url 'registro' %}">Registro</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container main-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
